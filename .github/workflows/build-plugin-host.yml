name: Build omsi-plugin-host32.exe

on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust target
        run: rustup target add i686-pc-windows-gnu

      - name: Install MinGW (with C++ support)
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-i686

      - name: Build omsi-plugin-host
        run: |
          CARGO_TARGET_I686_PC_WINDOWS_GNU_LINKER=i686-w64-mingw32-gcc \
          RUSTFLAGS="-C panic=abort -C link-arg=-Wl,--enable-stdcall-fixup" \
          cargo build --release --target i686-pc-windows-gnu -p omsi-plugin --bin omsi-plugin-host

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: omsi-plugin-host32
          path: target/i686-pc-windows-gnu/release/omsi-plugin-host.exe
